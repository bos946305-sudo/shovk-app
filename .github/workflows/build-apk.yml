name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Создать Android-проект
        run: |
          flutter create --platforms=android --project-name shovk_app --org ua.shovk _android_tmp
          cp -r _android_tmp/android ./android
          rm -rf _android_tmp
python3 prepare_android.py

      - name: Установить зависимости
        run: flutter pub get

      - name: Проверить код
        run: flutter analyze
        continue-on-error: true

      - name: Собрать APK
        run: flutter build apk --release

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: shovk-apk
          path: build/app/outputs/flutter-apk/app-release.apk
