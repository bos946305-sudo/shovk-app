name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Создать Android-часть проекта
        env:
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST || 'api.example.com' }}
        run: |
          flutter create --platforms=android --project-name shovk_app --org ua.shovk _android_tmp
          cp -r _android_tmp/android ./android
          rm -rf _android_tmp
          python3 tools/prepare_android.py

      - run: flutter pub get

      - name: Проверка кода (ошибки будут видны в логе)
        run: flutter analyze
        continue-on-error: true

      - name: Собрать APK
        run: >
          flutter build apk --release
          --dart-define=USE_MOCK=${{ vars.USE_MOCK || 'true' }}
          --dart-define=API_BASE=${{ vars.API_BASE || 'http://10.0.2.2:8000' }}
          --dart-define=PUBLIC_HOST=${{ vars.PUBLIC_HOST || 'api.example.com' }}

      - uses: actions/upload-artifact@v4
        with:
          name: shovk-apk
          path: build/app/outputs/flutter-apk/app-release.apk
